openapi: 3.0.3
info:
  title: Finance Manager API
  description: API for managing accounts, transactions and summaries
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

tags:
  - name: Accounts
  - name: Transactions
  - name: Summary
  - name: Export

paths:
  /accounts:
    get:
      tags: [Accounts]
      summary: Get all accounts
      operationId: getAllAccounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponseDTO"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Accounts]
      summary: Create new account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequestDTO"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponseDTO"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account by ID
      operationId: getAccountById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponseDTO"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Accounts]
      summary: Delete account
      operationId: deleteAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Account deleted
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{accountId}/summary:
    get:
      tags: [Summary]
      summary: Get account financial summary
      operationId: getAccountSummary
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummaryResponseDTO"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{accountId}/transactions:
    get:
      tags: [Transactions]
      summary: Get transactions for account with optional filters
      operationId: getTransactions
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionResponseDTO"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Transactions]
      summary: Create transaction for account
      operationId: createTransaction
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequestDTO"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{accountId}/transactions/{transactionId}:
    delete:
      tags: [Transactions]
      summary: Delete transaction
      operationId: deleteTransaction
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: transactionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Transaction deleted
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /accounts/{accountId}/transactions/export:
    get:
      tags: [Export]
      summary: Export transactions to CSV
      operationId: exportTransactionsCsv
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-06-05T12:30:00"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: "name: Account name is required"
        path:
          type: string
          example: /accounts

    AccountRequestDTO:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Main Account

    AccountResponseDTO:
      type: object
      additionalProperties: false
      required: [id, name, balance]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Main Account
        balance:
          type: number
          format: double
          example: 1250.75

    AccountSummaryResponseDTO:
      type: object
      additionalProperties: false
      required: [totalIncome, totalExpense, expenseByCategory]
      properties:
        totalIncome:
          type: number
          format: double
          example: 5000.00
        totalExpense:
          type: number
          format: double
          example: 3200.50
        expenseByCategory:
          type: object
          additionalProperties:
            type: number
            format: double
          example:
            Food: 1200.50
            Transport: 300.00

    TransactionRequestDTO:
      type: object
      additionalProperties: false
      required: [amount, type, category]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 49.99
        type:
          type: string
          enum: [INCOME, EXPENSE]
          example: EXPENSE
        category:
          type: string
          minLength: 2
          maxLength: 50
          example: Food
        description:
          type: string
          maxLength: 255
          example: Lunch at restaurant

    TransactionResponseDTO:
      type: object
      additionalProperties: false
      required: [id, amount, type, category, date, accountId, warning]
      properties:
        id:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          example: 49.99
        type:
          type: string
          enum: [INCOME, EXPENSE]
          example: EXPENSE
        category:
          type: string
          example: Food
        description:
          type: string
          nullable: true
          example: Lunch at restaurant
        date:
          type: string
          format: date-time
          example: "2026-06-05T12:30:00"
        accountId:
          type: integer
          format: int64
        warning:
          type: string
          nullable: true
          example: null