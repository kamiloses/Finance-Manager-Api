<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Budget App</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        #app {
            width: 100%;
            max-width: 600px;
            background: #111827;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0b1220;
            color: white;
            margin-bottom: 10px;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
            margin-top: 6px;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .primary {
            background: #38bdf8;
            color: black;
        }

        .danger {
            background: #ef4444;
            color: white;
        }

        .secondary {
            background: #334155;
            color: white;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: #0b1220;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .balance {
            font-weight: bold;
            color: #22c55e;
        }
    </style>
</head>

<body>

<div id="app">
    <h1>Accounts</h1>

    <input v-model="newName" placeholder="Account name" />

    <button class="primary" @click="createAccount">Add</button>
    <button class="secondary" @click="loadAccounts">Reload</button>

    <ul>
        <li v-for="a in accounts" :key="a.id">
            <div>
                <div>{{ a.name }}</div>
                <div class="balance">{{ a.balance }}</div>
            </div>

            <div class="actions">
                <button class="danger" @click="deleteAccount(a.id)">
                    Delete
                </button>
            </div>
        </li>
    </ul>
</div>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                accounts: [],
                newName: ""
            }
        },

        methods: {
            async loadAccounts() {
                const res = await fetch("http://localhost:8080/accounts");
                this.accounts = await res.json();
            },

            async createAccount() {
                await fetch("http://localhost:8080/accounts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: this.newName })
                });

                this.newName = "";
                await this.loadAccounts();
            },

            async deleteAccount(id) {
                await fetch(`http://localhost:8080/accounts/${id}`, {
                    method: "DELETE"
                });

                await this.loadAccounts();
            }
        },

        mounted() {
            this.loadAccounts();
        }
    }).mount("#app");
</script>

</body>
</html>
